name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-staging:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_branch, 'release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply additive database migrations
        run: npm run db:migrate
      - name: Deploy API to staging
        run: npx wrangler deploy --env staging --config workers/api/wrangler.jsonc
      - name: Smoke test staging API
        id: smoke
        continue-on-error: true
        run: curl --fail --show-error --silent --retry 4 --retry-delay 3 https://api-staging.nexoio.com.br/health | grep -q '"status":"ok"'
      - name: Rollback staging on failed smoke test
        if: steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --env staging --config workers/api/wrangler.jsonc --message "Automatic rollback after failed staging smoke test"
      - name: Fail after rollback
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  deploy-production:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply additive database migrations
        run: npm run db:migrate
      - name: Deploy API to production
        run: npx wrangler deploy --env production --config workers/api/wrangler.jsonc
      - name: Smoke test production API
        id: smoke
        continue-on-error: true
        run: curl --fail --show-error --silent --retry 4 --retry-delay 3 https://api.nexoio.com.br/health | grep -q '"status":"ok"'
      - name: Rollback production on failed smoke test
        if: steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --env production --config workers/api/wrangler.jsonc --message "Automatic rollback after failed production smoke test"
      - name: Fail after rollback
        if: steps.smoke.outcome == 'failure'
        run: exit 1
